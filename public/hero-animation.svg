<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" width="580" height="460">
<defs>
  <style>
    /* ── Base ── */
    text, tspan { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }

    /* ── State fade animation ── */
    .state { opacity: 0; }
    .state-0 { animation: showState 8s ease infinite 0s; }
    .state-1 { animation: showState 8s ease infinite 2s; }
    .state-2 { animation: showState 8s ease infinite 4s; }
    .state-3 { animation: showState 8s ease infinite 6s; }

    @keyframes showState {
      0%   { opacity: 0 }
      5%   { opacity: 1 }
      20%  { opacity: 1 }
      25%  { opacity: 0 }
      100% { opacity: 0 }
    }

    /* ── Progress bar sweep ── */
    .progress-fill {
      animation: progressSweep 8s linear infinite;
    }
    @keyframes progressSweep {
      0%   { width: 0 }
      25%  { width: 100 }
      50%  { width: 210 }
      75%  { width: 320 }
      100% { width: 408 }
    }

    /* ── Progress glow dot ── */
    .progress-dot {
      animation: dotMove 8s linear infinite;
    }
    @keyframes dotMove {
      0%   { cx: 68 }
      25%  { cx: 168 }
      50%  { cx: 278 }
      75%  { cx: 388 }
      100% { cx: 476 }
    }

    /* ── Stage dots ── */
    .dot-active {
      animation: dotPulse 8s ease infinite;
    }
    .dot-0 { animation-delay: 0s; }
    .dot-1 { animation-delay: 2s; }
    .dot-2 { animation-delay: 4s; }
    .dot-3 { animation-delay: 6s; }

    @keyframes dotPulse {
      0%   { r: 2.5; opacity: 0.35 }
      5%   { r: 4; opacity: 1 }
      20%  { r: 4; opacity: 1 }
      25%  { r: 2.5; opacity: 0.35 }
      100% { r: 2.5; opacity: 0.35 }
    }

    /* ── Ambient particles ── */
    .particle {
      animation: float 12s ease-in-out infinite alternate;
    }
    .p1 { animation-delay: 0s; }
    .p2 { animation-delay: -2s; }
    .p3 { animation-delay: -4s; }
    .p4 { animation-delay: -6s; }
    .p5 { animation-delay: -8s; }
    .p6 { animation-delay: -10s; }
    .p7 { animation-delay: -1s; }
    .p8 { animation-delay: -3s; }
    .p9 { animation-delay: -5s; }
    .p10 { animation-delay: -7s; }

    @keyframes float {
      0%   { transform: translate(0, 0); opacity: 0.04 }
      25%  { opacity: 0.07 }
      50%  { transform: translate(8px, -6px); opacity: 0.04 }
      75%  { opacity: 0.06 }
      100% { transform: translate(-4px, 5px); opacity: 0.03 }
    }

    /* ── Drafting lines ── */
    .draft-line {
      stroke-dasharray: 420;
      stroke-dashoffset: 420;
      animation: drawLine 8s ease-in-out infinite;
    }
    .dl-1 { animation-delay: 0s; }
    .dl-2 { animation-delay: 2.7s; }
    .dl-3 { animation-delay: 5.3s; }

    @keyframes drawLine {
      0%   { stroke-dashoffset: 420; opacity: 0 }
      10%  { stroke-dashoffset: 210; opacity: 0.04 }
      20%  { stroke-dashoffset: 0; opacity: 0.03 }
      30%  { opacity: 0 }
      100% { opacity: 0 }
    }

    /* ── Paid checkmark draw-in ── */
    .check-draw {
      stroke-dasharray: 40;
      stroke-dashoffset: 40;
      animation: drawCheck 8s ease infinite 6s;
    }
    @keyframes drawCheck {
      0%   { stroke-dashoffset: 40 }
      8%   { stroke-dashoffset: 0 }
      20%  { stroke-dashoffset: 0 }
      25%  { stroke-dashoffset: 40 }
      100% { stroke-dashoffset: 40 }
    }

    /* ── Paid pulse ring ── */
    .paid-ring {
      opacity: 0;
      animation: ringPulse 8s ease infinite 6s;
    }
    @keyframes ringPulse {
      0%   { r: 30; opacity: 0 }
      8%   { r: 36; opacity: 0.15 }
      12%  { r: 44; opacity: 0 }
      15%  { r: 36; opacity: 0.1 }
      20%  { r: 50; opacity: 0 }
      100% { opacity: 0 }
    }
  </style>
</defs>

<!-- ════ Background ════ -->
<rect width="580" height="460" fill="#EEF2FF" rx="0"/>

<!-- ════ Ambient Particles ════ -->
<g>
  <circle class="particle p1"  cx="45"  cy="38"  r="3.5" fill="#2563EB"/>
  <circle class="particle p2"  cx="520" cy="72"  r="2.5" fill="#2563EB"/>
  <circle class="particle p3"  cx="90"  cy="410" r="4"   fill="#2563EB"/>
  <circle class="particle p4"  cx="510" cy="390" r="3"   fill="#2563EB"/>
  <circle class="particle p5"  cx="280" cy="22"  r="2"   fill="#2563EB"/>
  <circle class="particle p6"  cx="30"  cy="230" r="3"   fill="#2563EB"/>
  <circle class="particle p7"  cx="555" cy="210" r="2.5" fill="#2563EB"/>
  <circle class="particle p8"  cx="160" cy="445" r="3"   fill="#2563EB"/>
  <circle class="particle p9"  cx="440" cy="30"  r="2"   fill="#2563EB"/>
  <circle class="particle p10" cx="350" cy="440" r="2.5" fill="#2563EB"/>
</g>

<!-- ════ Card Shadow (3 layers) ════ -->
<rect x="54" y="63" width="460" height="350" rx="18" fill="#0F172A" opacity="0.04"/>
<rect x="52" y="59" width="460" height="350" rx="18" fill="#0F172A" opacity="0.03"/>
<rect x="51" y="57" width="460" height="350" rx="18" fill="#0F172A" opacity="0.02"/>

<!-- ════ Card Body ════ -->
<rect x="50" y="55" width="460" height="350" rx="18" fill="#fff"/>
<rect x="50" y="55" width="460" height="350" rx="18" fill="none" stroke="#E2E8F0" stroke-width="0.5"/>

<!-- ════ Progress Bar Track ════ -->
<rect x="68" y="69" width="408" height="3" rx="1.5" fill="#F1F5F9"/>

<!-- ════ Progress Bar Fill (animated) ════ -->
<rect x="68" y="69" height="3" rx="1.5" fill="#2563EB" opacity="0.7">
  <animate attributeName="width" values="0;100;210;320;408" keyTimes="0;0.25;0.5;0.75;1" dur="8s" repeatCount="indefinite"/>
</rect>

<!-- ════ Drafting Lines (subtle) ════ -->
<line class="draft-line dl-1" x1="68" y1="150" x2="488" y2="150" stroke="#2563EB" stroke-width="0.5"/>
<line class="draft-line dl-2" x1="68" y1="230" x2="488" y2="230" stroke="#7C3AED" stroke-width="0.5"/>
<line class="draft-line dl-3" x1="68" y1="310" x2="488" y2="310" stroke="#EA580C" stroke-width="0.5"/>

<!-- ════════════════════════════════════════════════ -->
<!-- STATE 0: PROPOSAL                                -->
<!-- ════════════════════════════════════════════════ -->
<g class="state state-0">
  <!-- Icon badge -->
