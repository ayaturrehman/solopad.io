  <circle class="paid-ring" cx="290" cy="195" fill="none" stroke="#059669" stroke-width="1.5"/>
  <circle cx="290" cy="195" r="40" fill="#ECFDF5" opacity="0.7"/>
  <circle cx="290" cy="195" r="30" fill="#059669"/>

  <!-- Animated checkmark -->
  <path class="check-draw" d="M278 196 l7 7 l13 -15" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

