  <text x="290" y="309" font-size="12" fill="#94A3B8" text-anchor="middle">Acme Co. · Just now</text>
</g>

<!-- ════ Stage Dots (bottom center) ════ -->
<g>
  <circle class="dot-active dot-0" cx="263" cy="388" r="2.5" fill="#2563EB"/>
  <circle class="dot-active dot-1" cx="281" cy="388" r="2.5" fill="#7C3AED"/>
  <circle class="dot-active dot-2" cx="299" cy="388" r="2.5" fill="#EA580C"/>
  <circle class="dot-active dot-3" cx="317" cy="388" r="2.5" fill="#059669"/>
</g>

</svg>
