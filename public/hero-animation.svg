  <!-- Total -->
  <text x="86"  y="265" font-size="13" fill="#64748B">Total</text>
  <text x="474" y="265" font-size="22" font-weight="700" fill="#1E293B" text-anchor="end">$4,800</text>

  <!-- CTA Button -->
  <rect x="338" y="281" width="136" height="38" rx="9" fill="#2563EB"/>
