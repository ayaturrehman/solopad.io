    <line x1="-4" y1="-3" x2="4" y2="-3" stroke="#2563EB" stroke-width="1" stroke-linecap="round"/>
    <line x1="-4" y1="1"  x2="4" y2="1"  stroke="#2563EB" stroke-width="1" stroke-linecap="round"/>
    <line x1="-4" y1="5"  x2="1" y2="5"  stroke="#2563EB" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text x="138" y="105" font-size="10" font-weight="700" fill="#2563EB" letter-spacing="1">NEW PROPOSAL</text>
  <text x="138" y="125" font-size="19" font-weight="700" fill="#1E293B">Website Redesign</text>

  <!-- Divider -->
  <line x1="86" y1="147" x2="474" y2="147" stroke="#F1F5F9" stroke-width="1"/>

  <!-- Detail rows -->
  <text x="86"  y="171" font-size="12" fill="#94A3B8">Client</text>
  <text x="176" y="171" font-size="13" font-weight="500" fill="#1E293B">Acme Co.</text>

  <text x="86"  y="197" font-size="12" fill="#94A3B8">Scope</text>
  <text x="176" y="197" font-size="13" font-weight="500" fill="#1E293B">Full redesign + development</text>

  <text x="86"  y="223" font-size="12" fill="#94A3B8">Timeline</text>
  <text x="176" y="223" font-size="13" font-weight="500" fill="#1E293B">4 weeks</text>

  <!-- Total divider -->
