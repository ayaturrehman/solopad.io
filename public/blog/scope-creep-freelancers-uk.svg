<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#FAF6EF"/>
  
  <!-- Title -->
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1E293B" text-anchor="middle">Scope Creep Decision Flow</text>
  
  <!-- Card 1: In Scope -->
  <rect x="60" y="80" width="200" height="260" rx="12" fill="white" stroke="#10B981" stroke-width="3"/>
  <rect x="60" y="80" width="200" height="45" rx="12" fill="#DCFCE7"/>
  <text x="160" y="107" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#14532D" text-anchor="middle">In Scope</text>
  
  <!-- Checkmarks -->
  <circle cx="95" cy="155" r="14" fill="#DCFCE7" stroke="#10B981" stroke-width="2"/>
  <path d="M90 155L94 159L101 150" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="120" y="161" font-family="Arial, sans-serif" font-size="13" fill="#166534">In contract SOW</text>
  
  <circle cx="95" cy="195" r="14" fill="#DCFCE7" stroke="#10B981" stroke-width="2"/>
  <path d="M90 195L94 199L101 190" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="120" y="201" font-family="Arial, sans-serif" font-size="13" fill="#166534">Within revisions</text>
  
  <circle cx="95" cy="235" r="14" fill="#DCFCE7" stroke="#10B981" stroke-width="2"/>
  <path d="M90 235L94 239L101 230" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="120" y="241" font-family="Arial, sans-serif" font-size="13" fill="#166534">Same direction</text>
  
  <!-- Arrow Label -->
  <text x="160" y="285" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#14532D" text-anchor="middle">“</text>
  <text x="160" y="305" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#10B981" text-anchor="middle">Do it</text>
  <text x="160" y="325" font-family="Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle">No extra charge</text>
  
  <!-- Card 2: Change Request -->
  <rect x="300" y="80" width="200" height="260" rx="12" fill="white" stroke="#F59E0B" stroke-width="3"/>
  <rect x="300" y="80" width="200" height="45" rx="12" fill="#FEF3C7"/>
  <text x="400" y="107" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#78350F" text-anchor="middle">Change Request</text>
  
  <!-- Warning Icons -->
  <circle cx="335" cy="155" r="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="335" y="163" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#F59E0B" text-anchor="middle">!</text>
  <text x="360" y="161" font-family="Arial, sans-serif" font-size="13" fill="#92400E">Extra deliverable</text>
  
  <circle cx="335" cy="195" r="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="335" y="203" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#F59E0B" text-anchor="middle">!</text>
  <text x="360" y="201" font-family="Arial, sans-serif" font-size="13" fill="#92400E">Out of scope</text>
  
  <circle cx="335" cy="235" r="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="335" y="243" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#F59E0B" text-anchor="middle">!</text>
  <text x="360" y="241" font-family="Arial, sans-serif" font-size="13" fill="#92400E">New direction</text>
  
  <!-- Arrow Label -->
  <text x="400" y="285" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#78350F" text-anchor="middle">“</text>
  <text x="400" y="305" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#F59E0B" text-anchor="middle">Quote it</text>
  <text x="400" y="325" font-family="Arial, sans-serif" font-size="11" fill="#92400E" text-anchor="middle">Get approval first</text>
  
  <!-- Card 3: Phase 2 -->
  <rect x="540" y="80" width="200" height="260" rx="12" fill="white" stroke="#8B5CF6" stroke-width="3"/>
  <rect x="540" y="80" width="200" height="45" rx="12" fill="#EDE9FE"/>
  <text x="640" y="107" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#5B21B6" text-anchor="middle">Phase 2</text>
  
  <!-- Calendar Icons -->
  <rect x="570" y="145" width="24" height="24" rx="3" fill="white" stroke="#8B5CF6" stroke-width="2"/>
  <rect x="570" y="145" width="24" height="8" fill="#8B5CF6"/>
  <text x="605" y="161" font-family="Arial, sans-serif" font-size="13" fill="#5B21B6">After delivery</text>
  
  <rect x="570" y="185" width="24" height="24" rx="3" fill="white" stroke="#8B5CF6" stroke-width="2"/>
  <rect x="570" y="185" width="24" height="8" fill="#8B5CF6"/>
  <text x="605" y="201" font-family="Arial, sans-serif" font-size="13" fill="#5B21B6">Separate quote</text>
  
  <rect x="570" y="225" width="24" height="24" rx="3" fill="white" stroke="#8B5CF6" stroke-width="2"/>
  <rect x="570" y="225" width="24" height="8" fill="#8B5CF6"/>
  <text x="605" y="241" font-family="Arial, sans-serif" font-size="13" fill="#5B21B6">New milestone</text>
  
  <!-- Arrow Label -->
  <text x="640" y="285" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#5B21B6" text-anchor="middle">“</text>
  <text x="640" y="305" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#8B5CF6" text-anchor="middle">Park it</text>
  <text x="640" y="325" font-family="Arial, sans-serif" font-size="11" fill="#6D28D9" text-anchor="middle">After this project</text>
  
  <!-- Bottom Note -->
  <rect x="200" y="360" width="400" height="30" rx="6" fill="#F1F5F9"/>
  <text x="400" y="380" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Always get client approval in writing before starting extra work</text>
</svg>
