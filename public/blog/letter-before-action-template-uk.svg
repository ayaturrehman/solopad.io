<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8f9fa"/>
  
  <!-- Pattern grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#e9ecef" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Title -->
  <text x="600" y="60" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#212529" text-anchor="middle">Letter Before Action Flow</text>
  
  <!-- Step 1: Chase Emails -->
  <rect x="80" y="150" width="280" height="140" rx="8" fill="#fff" stroke="#0066cc" stroke-width="2"/>
  <text x="220" y="195" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#212529" text-anchor="middle">1. Polite Chase</text>
  <text x="220" y="225" font-family="Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle">Day 1, 7, 14</text>
  <text x="220" y="250" font-family="Arial, sans-serif" font-size="14" fill="#6c757d" text-anchor="middle">Friendly reminders</text>
  <text x="220" y="270" font-family="Arial, sans-serif" font-size="14" fill="#6c757d" text-anchor="middle">Invoice due date</text>
  
  <!-- Arrow 1 -->
  <path d="M 360 220 L 440 220" stroke="#0066cc" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0066cc"/>
    </marker>
  </defs>
  
  <!-- Step 2: Letter Before Action -->
  <rect x="440" y="150" width="320" height="140" rx="8" fill="#fff" stroke="#0066cc" stroke-width="2"/>
  <text x="600" y="195" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#212529" text-anchor="middle">2. Letter Before Action</text>
  <text x="600" y="225" font-family="Arial, sans-serif" font-size="16" fill="#495057" text-anchor="middle">After 1421 days</text>
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="14" fill="#6c757d" text-anchor="middle">Formal demand</text>
  <text x="600" y="270" font-family="Arial, sans-serif" font-size="14" fill="#6c757d" text-anchor="middle">+ Interest + Recovery fee</text>
  
  <!-- Arrow 2a -->
  <path d="M 600 290 L 600 340 L 540 340 L 540 380" stroke="#28a745" stroke-width="3" fill="none" marker-end="url(#arrowhead-green)"/>
  <defs>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#28a745"/>
    </marker>
  </defs>
  <text x="470" y="360" font-family="Arial, sans-serif" font-size="14" fill="#28a745" text-anchor="middle">They pay</text>
  
  <!-- Arrow 2b -->
  <path d="M 600 290 L 600 340 L 660 340 L 660 380" stroke="#dc3545" stroke-width="3" fill="none" marker-end="url(#arrowhead-red)"/>
  <defs>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#dc3545"/>
    </marker>
  </defs>
  <text x="730" y="360" font-family="Arial, sans-serif" font-size="14" fill="#dc3545" text-anchor="middle">They ignore</text>
  
  <!-- Step 3a: Paid -->
  <rect x="400" y="380" width="280" height="120" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="540" y="425" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#155724" text-anchor="middle"> Payment Received</text>
  <text x="540" y="455" font-family="Arial, sans-serif" font-size="14" fill="#155724" text-anchor="middle">Full amount + interest</text>
  <text x="540" y="480" font-family="Arial, sans-serif" font-size="14" fill="#155724" text-anchor="middle">+ recovery costs</text>
  
  <!-- Step 3b: Small Claims -->
  <rect x="720" y="380" width="400" height="120" rx="8" fill="#fff" stroke="#dc3545" stroke-width="2"/>
  <text x="920" y="425" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#721c24" text-anchor="middle">3. Small Claims Court</text>
  <text x="920" y="455" font-family="Arial, sans-serif" font-size="14" fill="#721c24" text-anchor="middle">File Money Claim Online</text>
  <text x="920" y="480" font-family="Arial, sans-serif" font-size="14" fill="#721c24" text-anchor="middle">Under £10,000  No solicitor needed</text>
  
  <!-- Timeline annotation -->
  <text x="600" y="560" font-family="Arial, sans-serif" font-size="16" fill="#6c757d" text-anchor="middle">Timeline: Day 1 ’ Day 14+ ’ Day 21+ ’ Legal Action</text>
  <text x="600" y="590" font-family="Arial, sans-serif" font-size="14" fill="#6c757d" text-anchor="middle">Most clients pay at Stage 2 when they see interest + recovery costs</text>
</svg>
