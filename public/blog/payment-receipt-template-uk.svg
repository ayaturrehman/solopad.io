<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#FAF6EF"/>
  
  <!-- Step 1: Invoice Sent -->
  <rect x="40" y="60" width="200" height="120" rx="12" fill="white" stroke="#E4DDD2" stroke-width="2"/>
  <circle cx="80" cy="90" r="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="80" y="97" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2563EB" text-anchor="middle">1</text>
  <text x="140" y="95" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#141B24">Invoice Sent</text>
  <text x="140" y="120" font-family="Arial, sans-serif" font-size="13" fill="#5C6570">Amount due:</text>
  <text x="140" y="137" font-family="Arial, sans-serif" font-size="13" fill="#5C6570">£2,400</text>
  <text x="140" y="160" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF">Payment requested</text>
  
  <!-- Arrow 1 -->
  <line x1="240" y1="120" x2="280" y2="120" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2: Payment Received -->
  <rect x="300" y="60" width="200" height="120" rx="12" fill="white" stroke="#E4DDD2" stroke-width="2"/>
  <circle cx="340" cy="90" r="16" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="340" y="97" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#16A34A" text-anchor="middle">2</text>
  <text x="400" y="88" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#141B24">Payment</text>
  <text x="400" y="109" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#141B24">Received</text>
  <text x="400" y="135" font-family="Arial, sans-serif" font-size="13" fill="#5C6570">Deposit: £1,200</text>
  <text x="400" y="155" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF">Remaining: £1,200</text>
  
  <!-- Arrow 2 -->
  <line x1="500" y1="120" x2="540" y2="120" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3: Receipt Issued -->
  <rect x="560" y="60" width="200" height="120" rx="12" fill="white" stroke="#E4DDD2" stroke-width="2"/>
  <circle cx="600" cy="90" r="16" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="600" y="97" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#16A34A" text-anchor="middle">3</text>
  <text x="660" y="88" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#141B24">Receipt</text>
  <text x="660" y="109" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#141B24">Issued</text>
  <text x="660" y="135" font-family="Arial, sans-serif" font-size="13" fill="#5C6570">£1,200 received</text>
  <text x="660" y="155" font-family="Arial, sans-serif" font-size="12" fill="#9CA3AF">Balance: £1,200</text>
  
  <!-- Deposit Flow Example (Bottom Section) -->
  <rect x="60" y="220" width="680" height="130" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  
  <!-- Icon -->
  <circle cx="100" cy="260" r="20" fill="#F97316"/>
  <text x="100" y="268" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">£</text>
  
  <!-- Deposit example text -->
  <text x="140" y="250" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#F97316">Deposit & Balance Receipt Example</text>
  
  <text x="140" y="278" font-family="Arial, sans-serif" font-size="13" fill="#7C2D12">Deposit receipt (50%): Shows £1,200 paid, £1,200 remaining, work commenced.</text>
  <text x="140" y="300" font-family="Arial, sans-serif" font-size="13" fill="#7C2D12">Balance receipt (final): Shows £1,200 paid, £0 remaining, project complete.</text>
  <text x="140" y="322" font-family="Arial, sans-serif" font-size="13" fill="#7C2D12">Each receipt references the invoice number and confirms the payment method.</text>
  
  <!-- Receipt checklist (bottom) -->
  <rect x="60" y="260" width="15" height="15" rx="2" fill="white" stroke="#16A34A" stroke-width="2"/>
  <line x1="64" y1="268" x2="68" y2="272" stroke="#16A34A" stroke-width="2"/>
  <line x1="68" y1="272" x2="73" y2="263" stroke="#16A34A" stroke-width="2"/>
  
  <rect x="60" y="285" width="15" height="15" rx="2" fill="white" stroke="#16A34A" stroke-width="2"/>
  <line x1="64" y1="293" x2="68" y2="297" stroke="#16A34A" stroke-width="2"/>
  <line x1="68" y1="297" x2="73" y2="288" stroke="#16A34A" stroke-width="2"/>
  
  <rect x="60" y="310" width="15" height="15" rx="2" fill="white" stroke="#16A34A" stroke-width="2"/>
  <line x1="64" y1="318" x2="68" y2="322" stroke="#16A34A" stroke-width="2"/>
  <line x1="68" y1="322" x2="73" y2="313" stroke="#16A34A" stroke-width="2"/>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2563EB"/>
    </marker>
  </defs>
</svg>
