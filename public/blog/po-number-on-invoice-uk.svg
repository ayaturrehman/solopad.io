<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#FAF6EF"/>
  
  <!-- Decorative elements -->
  <circle cx="120" cy="100" r="70" fill="#EFF6FF" opacity="0.6"/>
  <circle cx="1080" cy="530" r="90" fill="#FFF7ED" opacity="0.5"/>
  
  <!-- Title area -->
  <text x="600" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="600" fill="#141B24" text-anchor="middle">PO Number on Invoice  The Flow</text>
  <text x="600" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#5C6570" text-anchor="middle">How purchase orders work from the supplier's side</text>
  
  <!-- Step 1: Client Raises PO -->
  <g transform="translate(60, 160)">
    <!-- Card background -->
    <rect width="300" height="320" rx="16" fill="white" stroke="#E4DDD2" stroke-width="2"/>
    
    <!-- Step number -->
    <circle cx="30" cy="30" r="20" fill="#2563EB"/>
    <text x="30" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">1</text>
    
    <!-- Card header -->
    <text x="150" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#141B24" text-anchor="middle">Client Raises PO</text>
    
    <!-- PO document icon -->
    <g transform="translate(90, 80)">
      <rect width="120" height="140" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
      <!-- Header -->
      <rect x="10" y="10" width="100" height="30" rx="4" fill="#2563EB" opacity="0.9"/>
      <text x="60" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">PURCHASE ORDER</text>
      <!-- PO number -->
      <rect x="10" y="50" width="100" height="26" rx="4" fill="#DBEAFE"/>
      <text x="60" y="68" font-family="Monaco, monospace" font-size="14" font-weight="700" fill="#1E40AF" text-anchor="middle">PO-45892</text>
      <!-- Lines -->
      <line x1="10" y1="90" x2="110" y2="90" stroke="#2563EB" stroke-width="1.5" opacity="0.3"/>
      <line x1="10" y1="102" x2="90" y2="102" stroke="#2563EB" stroke-width="1.5" opacity="0.3"/>
      <line x1="10" y1="114" x2="100" y2="114" stroke="#2563EB" stroke-width="1.5" opacity="0.3"/>
    </g>
    
    <!-- Description -->
    <text x="150" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#5C6570" text-anchor="middle">Client's approval</text>
    <text x="150" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#5C6570" text-anchor="middle">for your work</text>
    <text x="150" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#3F4751" text-anchor="middle">They send you the PO</text>
  </g>
  
  <!-- Arrow 1 -->
  <g transform="translate(370, 310)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#2563EB" stroke-width="3"/>
    <polygon points="50,0 42,-6 42,6" fill="#2563EB"/>
  </g>
  
  <!-- Step 2: You Quote PO on Invoice -->
  <g transform="translate(450, 160)">
    <!-- Card background -->
    <rect width="300" height="320" rx="16" fill="white" stroke="#E4DDD2" stroke-width="2"/>
    
    <!-- Step number -->
    <circle cx="30" cy="30" r="20" fill="#2563EB"/>
    <text x="30" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">2</text>
    
    <!-- Card header -->
    <text x="150" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#141B24" text-anchor="middle">You Quote the PO</text>
    
    <!-- Invoice document icon -->
    <g transform="translate(90, 80)">
      <rect width="120" height="140" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/>
      <!-- Header -->
      <text x="60" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">INVOICE</text>
      <!-- Invoice number -->
      <line x1="10" y1="30" x2="110" y2="30" stroke="#2563EB" stroke-width="1" opacity="0.3"/>
      <text x="15" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#5C6570">Invoice No: INV-042</text>
      <!-- PO number highlighted -->
      <rect x="8" y="52" width="104" height="28" rx="4" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
      <text x="60" y="70" font-family="Monaco, monospace" font-size="11" font-weight="700" fill="#C2410C" text-anchor="middle">PO: PO-45892</text>
      <!-- Lines -->
      <line x1="10" y1="90" x2="110" y2="90" stroke="#2563EB" stroke-width="1" opacity="0.2"/>
      <line x1="10" y1="100" x2="90" y2="100" stroke="#2563EB" stroke-width="1" opacity="0.2"/>
      <line x1="10" y1="110" x2="100" y2="110" stroke="#2563EB" stroke-width="1" opacity="0.2"/>
      <line x1="10" y1="120" x2="70" y2="120" stroke="#2563EB" stroke-width="1" opacity="0.2"/>
    </g>
    
    <!-- Description -->
    <text x="150" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#5C6570" text-anchor="middle">Add the PO number</text>
    <text x="150" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#5C6570" text-anchor="middle">to your invoice</text>
    <text x="150" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#3F4751" text-anchor="middle">Exact match required</text>
  </g>
  
  <!-- Arrow 2 -->
  <g transform="translate(760, 310)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#2563EB" stroke-width="3"/>
    <polygon points="50,0 42,-6 42,6" fill="#2563EB"/>
  </g>
  
  <!-- Step 3: Accounts Match and Pay -->
  <g transform="translate(840, 160)">
    <!-- Card background -->
    <rect width="300" height="320" rx="16" fill="white" stroke="#E4DDD2" stroke-width="2"/>
    
    <!-- Step number -->
    <circle cx="30" cy="30" r="20" fill="#2563EB"/>
    <text x="30" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">3</text>
    
    <!-- Card header -->
    <text x="150" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#141B24" text-anchor="middle">Accounts Match & Pay</text>
    
    <!-- Checkmark icon -->
    <g transform="translate(105, 100)">
      <circle cx="45" cy="45" r="45" fill="#10B981" opacity="0.1"/>
      <circle cx="45" cy="45" r="35" fill="#10B981" opacity="0.2"/>
      <path d="M30 45 L40 55 L60 35" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    
    <!-- Description -->
    <text x="150" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#5C6570" text-anchor="middle">System matches</text>
    <text x="150" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#5C6570" text-anchor="middle">PO to invoice</text>
    <text x="150" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#059669" text-anchor="middle">Payment processed </text>
  </g>
  
  <!-- Warning box -->
  <g transform="translate(200, 520)">
    <rect width="800" height="80" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <circle cx="30" cy="40" r="18" fill="#DC2626"/>
    <text x="30" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">!</text>
    
    <text x="70" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#991B1B">No PO = Invoice Returned Unpaid</text>
    <text x="70" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#7F1D1D">Many NHS trusts and councils operate "No PO, No Pay" policies</text>
  </g>
</svg>
