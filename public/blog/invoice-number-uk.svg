<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#FAF6EF"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="80" fill="#EFF6FF" opacity="0.6"/>
  <circle cx="1100" cy="530" r="100" fill="#FFF7ED" opacity="0.5"/>
  
  <!-- Title area -->
  <text x="600" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="600" fill="#141B24" text-anchor="middle">Invoice Numbering Systems</text>
  <text x="600" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#5C6570" text-anchor="middle">Pick a format that keeps your invoices unique and HMRC-compliant</text>
  
  <!-- Card 1: Simple Sequential -->
  <g transform="translate(80, 170)">
    <!-- Card background -->
    <rect width="300" height="360" rx="16" fill="white" stroke="#E4DDD2" stroke-width="2"/>
    
    <!-- Card header -->
    <rect width="300" height="60" rx="16" fill="#EFF6FF"/>
    <text x="150" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#2563EB" text-anchor="middle">Simple Sequential</text>
    
    <!-- Invoice icon -->
    <g transform="translate(105, 90)">
      <rect width="90" height="110" rx="6" fill="white" stroke="#2563EB" stroke-width="2"/>
      <line x1="15" y1="20" x2="75" y2="20" stroke="#2563EB" stroke-width="2" opacity="0.3"/>
      <line x1="15" y1="30" x2="75" y2="30" stroke="#2563EB" stroke-width="2" opacity="0.3"/>
      
      <!-- Invoice number highlight -->
      <rect x="10" y="45" width="70" height="25" rx="4" fill="#DBEAFE"/>
      <text x="45" y="62" font-family="Monaco, monospace" font-size="16" font-weight="700" fill="#1E40AF" text-anchor="middle">0001</text>
      
      <line x1="15" y1="80" x2="75" y2="80" stroke="#2563EB" stroke-width="1" opacity="0.2"/>
      <line x1="15" y1="90" x2="60" y2="90" stroke="#2563EB" stroke-width="1" opacity="0.2"/>
    </g>
    
    <!-- Examples -->
    <g transform="translate(20, 230)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#3F4751">Examples:</text>
      <text x="0" y="25" font-family="Monaco, monospace" font-size="15" fill="#5C6570">0001</text>
      <text x="0" y="48" font-family="Monaco, monospace" font-size="15" fill="#5C6570">0002</text>
      <text x="0" y="71" font-family="Monaco, monospace" font-size="15" fill="#5C6570">0003</text>
    </g>
    
    <!-- Best for label -->
    <rect x="20" y="320" width="260" height="25" rx="6" fill="#F4EFE6"/>
    <text x="150" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#5C6570" text-anchor="middle">Best for: Simple tracking</text>
  </g>
  
  <!-- Card 2: Year-Prefixed -->
  <g transform="translate(450, 170)">
    <!-- Card background -->
    <rect width="300" height="360" rx="16" fill="white" stroke="#E4DDD2" stroke-width="2"/>
    
    <!-- Card header -->
    <rect width="300" height="60" rx="16" fill="#EFF6FF"/>
    <text x="150" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#2563EB" text-anchor="middle">Year-Prefixed</text>
    
    <!-- Invoice icon -->
    <g transform="translate(105, 90)">
      <rect width="90" height="110" rx="6" fill="white" stroke="#2563EB" stroke-width="2"/>
      <line x1="15" y1="20" x2="75" y2="20" stroke="#2563EB" stroke-width="2" opacity="0.3"/>
      <line x1="15" y1="30" x2="75" y2="30" stroke="#2563EB" stroke-width="2" opacity="0.3"/>
      
      <!-- Invoice number highlight -->
      <rect x="8" y="43" width="74" height="28" rx="4" fill="#DBEAFE"/>
      <text x="45" y="63" font-family="Monaco, monospace" font-size="13" font-weight="700" fill="#1E40AF" text-anchor="middle">2026-001</text>
      
      <line x1="15" y1="80" x2="75" y2="80" stroke="#2563EB" stroke-width="1" opacity="0.2"/>
      <line x1="15" y1="90" x2="60" y2="90" stroke="#2563EB" stroke-width="1" opacity="0.2"/>
    </g>
    
    <!-- Examples -->
    <g transform="translate(20, 230)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#3F4751">Examples:</text>
      <text x="0" y="25" font-family="Monaco, monospace" font-size="15" fill="#5C6570">INV-2026-001</text>
      <text x="0" y="48" font-family="Monaco, monospace" font-size="15" fill="#5C6570">INV-2026-042</text>
      <text x="0" y="71" font-family="Monaco, monospace" font-size="15" fill="#5C6570">INV-2027-001</text>
    </g>
    
    <!-- Best for label -->
    <rect x="20" y="320" width="260" height="25" rx="6" fill="#F4EFE6"/>
    <text x="150" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#5C6570" text-anchor="middle">Best for: Annual reset</text>
  </g>
  
  <!-- Card 3: Client-Coded -->
  <g transform="translate(820, 170)">
    <!-- Card background -->
    <rect width="300" height="360" rx="16" fill="white" stroke="#E4DDD2" stroke-width="2"/>
    
    <!-- Card header -->
    <rect width="300" height="60" rx="16" fill="#EFF6FF"/>
    <text x="150" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#2563EB" text-anchor="middle">Client-Coded</text>
    
    <!-- Invoice icon -->
    <g transform="translate(105, 90)">
      <rect width="90" height="110" rx="6" fill="white" stroke="#2563EB" stroke-width="2"/>
      <line x1="15" y1="20" x2="75" y2="20" stroke="#2563EB" stroke-width="2" opacity="0.3"/>
      <line x1="15" y1="30" x2="75" y2="30" stroke="#2563EB" stroke-width="2" opacity="0.3"/>
      
      <!-- Invoice number highlight -->
      <rect x="20" y="45" width="50" height="25" rx="4" fill="#DBEAFE"/>
      <text x="45" y="62" font-family="Monaco, monospace" font-size="16" font-weight="700" fill="#1E40AF" text-anchor="middle">NS-014</text>
      
      <line x1="15" y1="80" x2="75" y2="80" stroke="#2563EB" stroke-width="1" opacity="0.2"/>
      <line x1="15" y1="90" x2="60" y2="90" stroke="#2563EB" stroke-width="1" opacity="0.2"/>
    </g>
    
    <!-- Examples -->
    <g transform="translate(20, 230)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#3F4751">Examples:</text>
      <text x="0" y="25" font-family="Monaco, monospace" font-size="15" fill="#5C6570">NS-014</text>
      <text x="0" y="48" font-family="Monaco, monospace" font-size="15" fill="#5C6570">OAK-023</text>
      <text x="0" y="71" font-family="Monaco, monospace" font-size="15" fill="#5C6570">FUS-008</text>
    </g>
    
    <!-- Best for label -->
    <rect x="20" y="320" width="260" height="25" rx="6" fill="#F4EFE6"/>
    <text x="150" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#5C6570" text-anchor="middle">Best for: Client tracking</text>
  </g>
  
  <!-- Bottom note -->
  <g transform="translate(0, 570)">
    <rect x="300" y="0" width="600" height="40" rx="8" fill="#EFF6FF" opacity="0.5"/>
    <text x="600" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#5C6570" text-anchor="middle">All formats are HMRC-compliant when used sequentially</text>
  </g>
</svg>
