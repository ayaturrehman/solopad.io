<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="rates-title rates-desc">
  <title id="rates-title">Three-Tier Freelance Pricing Structure</title>
  <desc id="rates-desc">Diagram showing starter, growth, and premium package tiers with pricing and features</desc>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="600" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#0f172a" text-anchor="middle">Three-Tier Package Pricing</text>
  <text x="600" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#64748b" text-anchor="middle">Give clients choice  most choose the middle tier</text>
  
  <!-- Tier 1: Starter -->
  <g>
    <rect x="80" y="140" width="300" height="420" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Header -->
    <rect x="80" y="140" width="300" height="85" rx="16" fill="#3b82f6"/>
    <text x="230" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">STARTER</text>
    <text x="230" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#dbeafe" text-anchor="middle">Essential package</text>
    
    <!-- Price -->
    <text x="230" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#0f172a" text-anchor="middle">£1,800</text>
    
    <!-- Features -->
    <text x="110" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#475569" text-anchor="start"> 3-page website</text>
    <text x="110" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#475569" text-anchor="start"> Template design</text>
    <text x="110" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#475569" text-anchor="start"> Mobile responsive</text>
    <text x="110" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#475569" text-anchor="start"> Contact form</text>
    <text x="110" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#475569" text-anchor="start"> 1 round revisions</text>
    <text x="110" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#475569" text-anchor="start"> 7 day delivery</text>
    
    <!-- Badge -->
    <rect x="120" y="510" width="220" height="30" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="230" y="532" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#3b82f6" text-anchor="middle">Budget-conscious clients</text>
  </g>
  
  <!-- Tier 2: Growth (featured) -->
  <g>
    <rect x="450" y="110" width="300" height="465" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="3"/>
    
    <!-- Featured badge -->
    <rect x="520" y="100" width="160" height="28" rx="14" fill="#10b981"/>
    <text x="600" y="119" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">MOST POPULAR</text>
    
    <!-- Header -->
    <rect x="450" y="140" width="300" height="85" rx="16" fill="#10b981"/>
    <text x="600" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">GROWTH</text>
    <text x="600" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#d1fae5" text-anchor="middle">Recommended option</text>
    
    <!-- Price -->
    <text x="600" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="#0f172a" text-anchor="middle">£3,200</text>
    
    <!-- Features -->
    <text x="480" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="start"> 5-page website</text>
    <text x="480" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="start"> Custom design</text>
    <text x="480" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="start"> Mobile responsive</text>
    <text x="480" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="start"> Forms + newsletter</text>
    <text x="480" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="start"> 2 rounds revisions</text>
    <text x="480" y="505" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="start"> Basic SEO</text>
    <text x="480" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="start"> 14 day delivery</text>
  </g>
  
  <!-- Tier 3: Premium -->
  <g>
    <rect x="820" y="140" width="300" height="420" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Header -->
    <rect x="820" y="140" width="300" height="85" rx="16" fill="#8b5cf6"/>
    <text x="970" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">PREMIUM</text>
    <text x="970" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#ede9fe" text-anchor="middle">Full-service package</text>
    
    <!-- Price -->
    <text x="970" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#0f172a" text-anchor="middle">£5,500</text>
    
    <!-- Features -->
    <text x="850" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#475569" text-anchor="start"> 8-page website</text>
    <text x="850" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#475569" text-anchor="start"> Bespoke design</text>
    <text x="850" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#475569" text-anchor="start"> Mobile responsive</text>
    <text x="850" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#475569" text-anchor="start"> Advanced forms</text>
    <text x="850" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#475569" text-anchor="start"> 3 rounds revisions</text>
    <text x="850" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#475569" text-anchor="start"> Advanced SEO</text>
    <text x="850" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#475569" text-anchor="start"> Content support</text>
    <text x="850" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#475569" text-anchor="start"> 10 day priority</text>
  </g>
  
  <!-- Bottom note -->
  <text x="600" y="605" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#475569" text-anchor="middle">High tier anchors the middle as best value  low tier filters out clients who cannot afford you</text>
</svg>
