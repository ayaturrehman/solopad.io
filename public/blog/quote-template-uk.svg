<svg width="800" height="300" viewBox="0 0 800 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Card 1: Client Brief -->
  <g>
    <rect x="20" y="60" width="220" height="180" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <circle cx="130" cy="110" r="24" fill="#2563EB"/>
    <path d="M120 110L128 118L142 102" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="130" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#1e40af">Client Brief</text>
    <text x="130" y="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#3b82f6">Scope defined</text>
    <text x="130" y="205" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#3b82f6">Budget discussed</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M250 150L280 150" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
  <path d="M275 145L280 150L275 155" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Card 2: Quote Sent -->
  <g>
    <rect x="290" y="60" width="220" height="180" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <rect x="330" y="100" width="140" height="90" rx="6" fill="white" stroke="#F59E0B" stroke-width="1.5"/>
    <line x1="340" y1="115" x2="440" y2="115" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <line x1="340" y1="130" x2="420" y2="130" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="340" y1="145" x2="410" y2="145" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="340" y1="160" x2="430" y2="160" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="340" y1="175" x2="400" y2="175" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <text x="400" y="215" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#92400e">Quote Sent</text>
    <text x="400" y="235" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#b45309">Price breakdown</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M520 150L550 150" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
  <path d="M545 145L550 150L545 155" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Card 3: Accepted ’ Deposit -->
  <g>
    <rect x="560" y="60" width="220" height="180" rx="12" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <circle cx="670" cy="110" r="24" fill="#10B981"/>
    <path d="M660 110L668 118L682 102" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="670" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#065f46">Accepted</text>
    <text x="670" y="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#059669">Deposit invoice</text>
    <text x="670" y="205" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#059669">Work begins</text>
  </g>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#374151">Quote Workflow</text>
</svg>
