<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" aria-labelledby="one-page-proposal-structure-title">
  <title id="one-page-proposal-structure-title">One-page proposal structure showing three sections: problem and outcome, scope and investment, and acceptance path</title>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1a1a1a">One-Page Proposal Structure</text>
  
  <!-- Card 1: Problem & Outcome -->
  <g>
    <rect x="40" y="70" width="220" height="280" rx="8" fill="#ffffff" stroke="#1976d2" stroke-width="2.5"/>
    <rect x="40" y="70" width="220" height="45" rx="8" fill="#1976d2"/>
    <text x="150" y="98" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Problem & Outcome</text>
    
    <!-- Check marks and content -->
    <g transform="translate(55, 135)">
      <circle cx="8" cy="-3" r="8" fill="#4caf50"/>
      <path d="M5,-3 L7,0 L11,-6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="25" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#424242">Restate their problem</text>
    </g>
    
    <g transform="translate(55, 170)">
      <circle cx="8" cy="-3" r="8" fill="#4caf50"/>
      <path d="M5,-3 L7,0 L11,-6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="25" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#424242">Show you understand</text>
    </g>
    
    <g transform="translate(55, 205)">
      <circle cx="8" cy="-3" r="8" fill="#4caf50"/>
      <path d="M5,-3 L7,0 L11,-6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="25" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#424242">What you will deliver</text>
    </g>
    
    <g transform="translate(55, 240)">
      <circle cx="8" cy="-3" r="8" fill="#4caf50"/>
      <path d="M5,-3 L7,0 L11,-6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="25" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#424242">Expected outcome</text>
    </g>
    
    <text x="150" y="285" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-style="italic" fill="#757575">Builds trust</text>
  </g>
  
  <!-- Card 2: Scope & Investment -->
  <g>
    <rect x="290" y="70" width="220" height="280" rx="8" fill="#ffffff" stroke="#7b1fa2" stroke-width="2.5"/>
    <rect x="290" y="70" width="220" height="45" rx="8" fill="#7b1fa2"/>
    <text x="400" y="98" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Scope & Investment</text>
    
    <g transform="translate(305, 135)">
      <circle cx="8" cy="-3" r="8" fill="#4caf50"/>
      <path d="M5,-3 L7,0 L11,-6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="25" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#424242">Scope bullets (included)</text>
    </g>
    
    <g transform="translate(305, 170)">
      <circle cx="8" cy="-3" r="8" fill="#4caf50"/>
      <path d="M5,-3 L7,0 L11,-6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="25" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#424242">Out-of-scope note</text>
    </g>
    
    <g transform="translate(305, 205)">
      <circle cx="8" cy="-3" r="8" fill="#4caf50"/>
      <path d="M5,-3 L7,0 L11,-6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="25" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#424242">GBP investment (3 tiers)</text>
    </g>
    
    <g transform="translate(305, 240)">
      <circle cx="8" cy="-3" r="8" fill="#4caf50"/>
      <path d="M5,-3 L7,0 L11,-6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="25" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#424242">Timeline + deposit %</text>
    </g>
    
    <text x="400" y="285" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-style="italic" fill="#757575">Protects scope</text>
  </g>
  
  <!-- Card 3: Acceptance Path -->
  <g>
    <rect x="540" y="70" width="220" height="280" rx="8" fill="#ffffff" stroke="#f57c00" stroke-width="2.5"/>
    <rect x="540" y="70" width="220" height="45" rx="8" fill="#f57c00"/>
    <text x="650" y="98" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Acceptance Path</text>
    
    <g transform="translate(555, 135)">
      <circle cx="8" cy="-3" r="8" fill="#4caf50"/>
      <path d="M5,-3 L7,0 L11,-6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="25" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#424242">How to say yes</text>
    </g>
    
    <g transform="translate(555, 170)">
      <circle cx="8" cy="-3" r="8" fill="#4caf50"/>
      <path d="M5,-3 L7,0 L11,-6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="25" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#424242">Reply YES or sign</text>
    </g>
    
    <g transform="translate(555, 205)">
      <circle cx="8" cy="-3" r="8" fill="#4caf50"/>
      <path d="M5,-3 L7,0 L11,-6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="25" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#424242">Valid-until date</text>
    </g>
    
    <g transform="translate(555, 240)">
      <circle cx="8" cy="-3" r="8" fill="#4caf50"/>
      <path d="M5,-3 L7,0 L11,-6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="25" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#424242">Next step is clear</text>
    </g>
    
    <text x="650" y="285" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-style="italic" fill="#757575">Closes the deal</text>
  </g>
  
  <!-- Bottom note -->
  <text x="400" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1976d2">One page. One decision. No confusing attachments.</text>
</svg>
