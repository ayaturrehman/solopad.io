<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#1e293b">Scope of Work Components</text>
  <text x="600" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">Essential sections to prevent scope creep and protect your time</text>
  
  <!-- Central SOW document -->
  <g transform="translate(600, 200)">
    <rect x="-140" y="-40" width="280" height="80" rx="8" fill="#fff" stroke="#2563eb" stroke-width="3"/>
    <text x="0" y="-10" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1e40af">Scope of Work</text>
    <text x="0" y="10" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Project boundaries &amp; deliverables</text>
    <text x="0" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Prevents unpaid scope creep</text>
  </g>
  
  <!-- Branch lines from center -->
  <line x1="460" y1="200" x2="180" y2="280" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="460" y1="200" x2="360" y2="360" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="600" y1="240" x2="600" y2="360" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="740" y1="200" x2="840" y2="360" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="740" y1="200" x2="1020" y2="280" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Component 1: Deliverables -->
  <g transform="translate(180, 310)">
    <rect x="-100" y="-25" width="200" height="100" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#15803d"> Deliverables</text>
    <text x="0" y="15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#166534">What you will deliver</text>
    <text x="0" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#166534">Define "done" clearly</text>
    <text x="0" y="45" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#166534">File formats included</text>
    <text x="0" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#22c55e">Core agreement</text>
  </g>
  
  <!-- Component 2: Out of Scope -->
  <g transform="translate(360, 390)">
    <rect x="-95" y="-25" width="190" height="100" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#b91c1c"> Out of Scope</text>
    <text x="0" y="15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#991b1b">What is NOT included</text>
    <text x="0" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#991b1b">Prevent assumptions</text>
    <text x="0" y="45" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#991b1b">Name common extras</text>
    <text x="0" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#ef4444">Sets boundaries</text>
  </g>
  
  <!-- Component 3: Revisions -->
  <g transform="translate(600, 390)">
    <rect x="-85" y="-25" width="170" height="100" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1e40af">» Revisions</text>
    <text x="0" y="15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1e3a8a">23 rounds included</text>
    <text x="0" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1e3a8a">Define what counts</text>
    <text x="0" y="45" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1e3a8a">Charge beyond limit</text>
    <text x="0" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#3b82f6">Stops endless tweaks</text>
  </g>
  
  <!-- Component 4: Change Orders -->
  <g transform="translate(840, 390)">
    <rect x="-95" y="-25" width="190" height="100" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#b45309">£ Change Orders</text>
    <text x="0" y="15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#92400e">Extra work = extra cost</text>
    <text x="0" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#92400e">Provide quote upfront</text>
    <text x="0" y="45" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#92400e">Invoice separately</text>
    <text x="0" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#f59e0b">Protects cashflow</text>
  </g>
  
  <!-- Component 5: Acceptance -->
  <g transform="translate(1020, 310)">
    <rect x="-95" y="-25" width="190" height="100" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#6d28d9"> Acceptance</text>
    <text x="0" y="15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#5b21b6">Sign-off criteria</text>
    <text x="0" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#5b21b6">Project closure</text>
    <text x="0" y="45" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#5b21b6">Final payment trigger</text>
    <text x="0" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#8b5cf6">Closes the loop</text>
  </g>
  
  <!-- Bottom benefits section -->
  <g transform="translate(600, 525)">
    <rect x="-350" y="-20" width="700" height="60" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="0" y="0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Result: Clear Boundaries + No Unpaid Work</text>
    <text x="0" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Client knows what to expect · You know when to stop · Change requests become paid work</text>
  </g>
</svg>
