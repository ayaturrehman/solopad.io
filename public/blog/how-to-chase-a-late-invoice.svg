<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="400" fill="#f8f9fa"/>
  
  <!-- Timeline line -->
  <line x1="100" y1="200" x2="1100" y2="200" stroke="#cbd5e1" stroke-width="3"/>
  
  <!-- Day 1 - Polite Nudge -->
  <g transform="translate(200, 200)">
    <circle cx="0" cy="0" r="20" fill="#3b82f6"/>
    <text x="0" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1e293b">Day 1</text>
    <text x="0" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">Polite nudge</text>
    
    <!-- Email icon -->
    <rect x="-35" y="-120" width="70" height="50" rx="4" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M -35,-120 L 0,-90 L 35,-120" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <text x="0" y="-55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">"Following up..."</text>
  </g>
  
  <!-- Day 7 - Firmer Reminder -->
  <g transform="translate(500, 200)">
    <circle cx="0" cy="0" r="20" fill="#f59e0b"/>
    <text x="0" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1e293b">Day 7</text>
    <text x="0" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">Firmer reminder</text>
    
    <!-- Email icon with urgency -->
    <rect x="-35" y="-120" width="70" height="50" rx="4" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
    <path d="M -35,-120 L 0,-90 L 35,-120" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="25" cy="-110" r="8" fill="#f59e0b"/>
    <text x="25" y="-106" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#fff">!</text>
    <text x="0" y="-55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">"Still overdue..."</text>
  </g>
  
  <!-- Day 14 - Formal Notice -->
  <g transform="translate(800, 200)">
    <circle cx="0" cy="0" r="20" fill="#ef4444"/>
    <text x="0" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1e293b">Day 14</text>
    <text x="0" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">Formal notice</text>
    
    <!-- Document icon -->
    <rect x="-30" y="-125" width="60" height="80" rx="3" fill="#fff" stroke="#ef4444" stroke-width="2"/>
    <line x1="-20" y1="-110" x2="20" y2="-110" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="-20" y1="-95" x2="20" y2="-95" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="-20" y1="-80" x2="20" y2="-80" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="-20" y1="-65" x2="10" y2="-65" stroke="#cbd5e1" stroke-width="2"/>
    <text x="0" y="-30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#ef4444">Legal rights</text>
  </g>
  
  <!-- Beyond - Escalation -->
  <g transform="translate(1050, 200)">
    <circle cx="0" cy="0" r="20" fill="#64748b"/>
    <text x="0" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1e293b">Day 21+</text>
    <text x="0" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">Escalate</text>
    
    <!-- Gavel/legal icon -->
    <g transform="translate(0, -95)">
      <rect x="-8" y="-25" width="16" height="35" rx="2" fill="#64748b"/>
      <rect x="-20" y="-30" width="40" height="10" rx="2" fill="#64748b"/>
      <ellipse cx="0" cy="20" rx="35" ry="8" fill="#cbd5e1"/>
    </g>
    <text x="0" y="-45" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748b">Court claim</text>
  </g>
  
  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#1e293b">Late Invoice Chase Timeline</text>
  <text x="600" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">A structured approach to getting paid without burning bridges</text>
  
  <!-- Progress indicators -->
  <g opacity="0.6">
    <path d="M 200,200 L 500,200" stroke="#3b82f6" stroke-width="4" stroke-dasharray="4,4"/>
    <path d="M 500,200 L 800,200" stroke="#f59e0b" stroke-width="4" stroke-dasharray="4,4"/>
    <path d="M 800,200 L 1050,200" stroke="#ef4444" stroke-width="4" stroke-dasharray="4,4"/>
  </g>
  
  <!-- Key at bottom -->
  <g transform="translate(100, 340)">
    <circle cx="0" cy="0" r="6" fill="#3b82f6"/>
    <text x="15" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Friendly &amp; helpful</text>
  </g>
  <g transform="translate(300, 340)">
    <circle cx="0" cy="0" r="6" fill="#f59e0b"/>
    <text x="15" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Firm &amp; clear deadline</text>
  </g>
  <g transform="translate(520, 340)">
    <circle cx="0" cy="0" r="6" fill="#ef4444"/>
    <text x="15" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Legal framework mentioned</text>
  </g>
  <g transform="translate(770, 340)">
    <circle cx="0" cy="0" r="6" fill="#64748b"/>
    <text x="15" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Formal action if needed</text>
  </g>
</svg>
