<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="600" fill="#f8f9fa"/>
  
  <!-- Pattern grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#e9ecef" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#grid)"/>
  
  <!-- Title -->
  <text x="600" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#212529" text-anchor="middle">When to Register for VAT: Decision Flow + Invoice Changes</text>
  
  <!-- Left side: Rolling turnover and threshold decision -->
  
  <!-- Rolling 12-month tracker box -->
  <rect x="40" y="70" width="280" height="140" rx="8" fill="#fff" stroke="#0066cc" stroke-width="3"/>
  <text x="180" y="100" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0066cc" text-anchor="middle">Rolling 12-Month</text>
  <text x="180" y="125" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0066cc" text-anchor="middle">Turnover Tracker</text>
  <text x="180" y="155" font-family="Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">Add current month invoices,</text>
  <text x="180" y="175" font-family="Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">drop month 13.</text>
  <text x="180" y="195" font-family="Arial, sans-serif" font-size="14" fill="#6c757d" text-anchor="middle">Count invoice date, not payment.</text>
  
  <!-- Arrow down -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0066cc"/>
    </marker>
  </defs>
  <path d="M 180 210 L 180 240" stroke="#0066cc" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Threshold decision diamond -->
  <g>
    <polygon points="180,240 280,300 180,360 80,300" fill="#fff" stroke="#dc3545" stroke-width="3"/>
    <text x="180" y="290" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#dc3545" text-anchor="middle">Over</text>
    <text x="180" y="310" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#dc3545" text-anchor="middle">£90,000?</text>
    <text x="180" y="330" font-family="Arial, sans-serif" font-size="12" fill="#6c757d" text-anchor="middle">(threshold)</text>
  </g>
  
  <!-- Arrow right: YES - must register -->
  <path d="M 280 300 L 360 300" stroke="#dc3545" stroke-width="3" fill="none" marker-end="url(#arrowhead-red)"/>
  <defs>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#dc3545"/>
    </marker>
  </defs>
  <text x="320" y="290" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc3545" text-anchor="middle">YES</text>
  
  <!-- Must register box -->
  <rect x="360" y="260" width="200" height="80" rx="8" fill="#dc3545" stroke="#dc3545" stroke-width="3"/>
  <text x="460" y="290" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">MUST REGISTER</text>
  <text x="460" y="315" font-family="Arial, sans-serif" font-size="13" fill="#fff" text-anchor="middle">Within 30 days of</text>
  <text x="460" y="332" font-family="Arial, sans-serif" font-size="13" fill="#fff" text-anchor="middle">end of threshold month</text>
  
  <!-- Arrow down: NO - under threshold -->
  <path d="M 180 360 L 180 390" stroke="#28a745" stroke-width="3" fill="none" marker-end="url(#arrowhead-green)"/>
  <defs>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#28a745"/>
    </marker>
  </defs>
  <text x="195" y="380" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#28a745">NO</text>
  
  <!-- Under threshold decision diamond -->
  <g>
    <polygon points="180,390 280,450 180,510 80,450" fill="#fff" stroke="#28a745" stroke-width="3"/>
    <text x="180" y="435" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#28a745" text-anchor="middle">B2B clients</text>
    <text x="180" y="455" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#28a745" text-anchor="middle">+ high VAT-able</text>
    <text x="180" y="475" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#28a745" text-anchor="middle">expenses?</text>
  </g>
  
  <!-- YES voluntary -->
  <path d="M 280 450 L 350 450" stroke="#28a745" stroke-width="3" fill="none" marker-end="url(#arrowhead-green)"/>
  <text x="315" y="440" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#28a745" text-anchor="middle">YES</text>
  <rect x="350" y="420" width="180" height="60" rx="6" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="440" y="445" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#155724" text-anchor="middle">Consider voluntary</text>
  <text x="440" y="465" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#155724" text-anchor="middle">registration</text>
  
  <!-- NO stay unregistered -->
  <path d="M 80 450 L 20 450" stroke="#28a745" stroke-width="3" fill="none" marker-end="url(#arrowhead-green-left)"/>
  <defs>
    <marker id="arrowhead-green-left" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto">
      <polygon points="10 0, 0 3, 10 6" fill="#28a745"/>
    </marker>
  </defs>
  <text x="50" y="440" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#28a745" text-anchor="middle">NO</text>
  <rect x="20" y="420" width="60" height="60" rx="6" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="50" y="445" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#155724" text-anchor="middle">Stay</text>
  <text x="50" y="465" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#155724" text-anchor="middle">un-</text>
  <text x="50" y="482" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#155724" text-anchor="middle">reg.</text>
  
  <!-- Right side: Invoice comparison -->
  
  <!-- Section label -->
  <text x="850" y="85" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#212529" text-anchor="middle">What Changes on Your Invoice</text>
  
  <!-- Before VAT box -->
  <rect x="640" y="110" width="210" height="180" rx="8" fill="#fff" stroke="#6c757d" stroke-width="2"/>
  <text x="745" y="135" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#495057" text-anchor="middle">Before VAT</text>
  <line x1="650" y1="145" x2="840" y2="145" stroke="#dee2e6" stroke-width="1"/>
  
  <text x="660" y="165" font-family="Arial, sans-serif" font-size="12" fill="#495057">Brand identity design</text>
  <line x1="650" y1="175" x2="840" y2="175" stroke="#dee2e6" stroke-width="1"/>
  
  <text x="660" y="240" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#212529">Total due:</text>
  <text x="810" y="240" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#212529" text-anchor="end">£2,400</text>
  <line x1="650" y1="250" x2="840" y2="250" stroke="#495057" stroke-width="2"/>
  
  <text x="660" y="270" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">Simple. One line.</text>
  
  <!-- Arrow right -->
  <path d="M 850 200 L 920 200" stroke="#0066cc" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="885" y="190" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0066cc" text-anchor="middle">Register</text>
  
  <!-- After VAT box -->
  <rect x="920" y="110" width="240" height="220" rx="8" fill="#fff" stroke="#0066cc" stroke-width="3"/>
  <text x="1040" y="135" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0066cc" text-anchor="middle">After VAT</text>
  <line x1="930" y1="145" x2="1150" y2="145" stroke="#dee2e6" stroke-width="1"/>
  
  <text x="940" y="165" font-family="Arial, sans-serif" font-size="11" fill="#0066cc" font-weight="bold">VAT Number: GB 123 4567 89</text>
  <line x1="930" y1="175" x2="1150" y2="175" stroke="#dee2e6" stroke-width="1"/>
  
  <text x="940" y="195" font-family="Arial, sans-serif" font-size="12" fill="#495057">Brand identity design</text>
  <line x1="930" y1="205" x2="1150" y2="205" stroke="#dee2e6" stroke-width="1"/>
  
  <text x="940" y="225" font-family="Arial, sans-serif" font-size="13" fill="#495057">Net amount:</text>
  <text x="1130" y="225" font-family="Arial, sans-serif" font-size="13" fill="#495057" text-anchor="end">£2,400.00</text>
  
  <text x="940" y="245" font-family="Arial, sans-serif" font-size="13" fill="#495057">VAT (20%):</text>
  <text x="1130" y="245" font-family="Arial, sans-serif" font-size="13" fill="#495057" text-anchor="end">£480.00</text>
  
  <line x1="930" y1="255" x2="1150" y2="255" stroke="#495057" stroke-width="2"/>
  
  <text x="940" y="280" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#212529">Total due:</text>
  <text x="1130" y="280" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#212529" text-anchor="end">£2,880.00</text>
  <line x1="930" y1="290" x2="1150" y2="290" stroke="#212529" stroke-width="2"/>
  
  <text x="940" y="310" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">Net + VAT shown separately.</text>
  <text x="940" y="325" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">VAT-registered clients reclaim VAT.</text>
  
  <!-- Key reminder boxes -->
  
  <!-- Late registration warning -->
  <rect x="40" y="540" width="340" height="50" rx="6" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="50" y="560" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#856404">  Late registration penalty:</text>
  <text x="50" y="580" font-family="Arial, sans-serif" font-size="11" fill="#856404">You owe VAT you never charged + interest + 10-30% penalty</text>
  
  <!-- Track monthly reminder -->
  <rect x="400" y="540" width="280" height="50" rx="6" fill="#d1ecf1" stroke="#17a2b8" stroke-width="2"/>
  <text x="410" y="560" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0c5460"> Track rolling turnover monthly</text>
  <text x="410" y="580" font-family="Arial, sans-serif" font-size="11" fill="#0c5460">Set reminder: 1st of each month, check last 12 months</text>
  
  <!-- Source -->
  <rect x="700" y="540" width="460" height="50" rx="6" fill="#e2e3e5" stroke="#6c757d" stroke-width="2"/>
  <text x="710" y="560" font-family="Arial, sans-serif" font-size="11" fill="#495057">Threshold: £90,000 (2026). Register within 30 days of end of threshold month.</text>
  <text x="710" y="577" font-family="Arial, sans-serif" font-size="11" fill="#495057">Source: GOV.UK Register for VAT guidance | Not tax advice  check current rules</text>
</svg>
