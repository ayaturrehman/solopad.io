<svg width="800" height="300" viewBox="0 0 800 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Card 1: Control -->
  <g>
    <rect x="20" y="60" width="220" height="180" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <circle cx="130" cy="110" r="24" fill="#2563EB"/>
    <path d="M120 105L125 115L140 100" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M117 115L122 125L137 110" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="130" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#1e40af">Control</text>
    <text x="130" y="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#3b82f6">Choose how</text>
    <text x="130" y="205" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#3b82f6">Choose when</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M250 150L280 150" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
  <path d="M275 145L280 150L275 155" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Card 2: Substitution -->
  <g>
    <rect x="290" y="60" width="220" height="180" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="400" cy="110" r="24" fill="#F59E0B"/>
    <path d="M395 105L395 115M390 110L400 110" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <path d="M405 105L405 115M400 110L410 110" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <text x="400" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#92400e">Substitution</text>
    <text x="400" y="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#b45309">Send someone</text>
    <text x="400" y="205" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#b45309">else to work</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M520 150L550 150" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
  <path d="M545 145L550 150L545 155" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Card 3: Payment -->
  <g>
    <rect x="560" y="60" width="220" height="180" rx="12" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <circle cx="670" cy="110" r="24" fill="#10B981"/>
    <text x="670" y="116" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="white">£</text>
    <text x="670" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#065f46">Payment</text>
    <text x="670" y="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#059669">Invoice for</text>
    <text x="670" y="205" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#059669">completed work</text>
  </g>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#374151">Contract for Services: Self-Employed</text>
</svg>
