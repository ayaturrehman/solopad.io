<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#FAF6EF"/>
  
  <!-- Decorative elements -->
  <circle cx="120" cy="120" r="90" fill="#EFF6FF" opacity="0.6"/>
  <circle cx="1080" cy="510" r="110" fill="#FFF7ED" opacity="0.5"/>
  
  <!-- Title area -->
  <text x="600" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="600" fill="#141B24" text-anchor="middle">Self-Billing Invoice Flow</text>
  <text x="600" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#5C6570" text-anchor="middle">How freelancers receive and record self-billed invoices</text>
  
  <!-- Step 1: Agreement Signed -->
  <g transform="translate(70, 160)">
    <rect width="240" height="320" rx="16" fill="white" stroke="#E4DDD2" stroke-width="2"/>
    <rect width="240" height="50" rx="16" fill="#DBEAFE"/>
    <text x="120" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1E40AF" text-anchor="middle">1. Agreement Signed</text>
    
    <!-- Document with signature icon -->
    <g transform="translate(65, 80)">
      <rect width="110" height="140" rx="8" fill="white" stroke="#2563EB" stroke-width="3"/>
      <text x="55" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1E40AF" text-anchor="middle">SELF-BILLING</text>
      <text x="55" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1E40AF" text-anchor="middle">AGREEMENT</text>
      
      <!-- Agreement terms -->
      <line x1="15" y1="55" x2="95" y2="55" stroke="#2563EB" stroke-width="1" opacity="0.3"/>
      <line x1="15" y1="65" x2="95" y2="65" stroke="#2563EB" stroke-width="1" opacity="0.3"/>
      <line x1="15" y1="75" x2="75" y2="75" stroke="#2563EB" stroke-width="1" opacity="0.3"/>
      
      <!-- Checkboxes -->
      <rect x="15" y="85" width="10" height="10" rx="2" fill="#22C55E"/>
      <path d="M 17 90 L 19 92 L 23 88" stroke="white" stroke-width="1.5" fill="none"/>
      <line x1="30" y1="90" x2="95" y2="90" stroke="#2563EB" stroke-width="1" opacity="0.3"/>
      
      <rect x="15" y="100" width="10" height="10" rx="2" fill="#22C55E"/>
      <path d="M 17 105 L 19 107 L 23 103" stroke="white" stroke-width="1.5" fill="none"/>
      <line x1="30" y1="105" x2="95" y2="105" stroke="#2563EB" stroke-width="1" opacity="0.3"/>
      
      <!-- Signature line -->
      <line x1="15" y1="125" x2="95" y2="125" stroke="#1E40AF" stroke-width="2"/>
      <text x="55" y="137" font-family="Brush Script MT, cursive" font-size="14" fill="#1E40AF" text-anchor="middle">Signed</text>
    </g>
    
    <text x="120" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#5C6570" text-anchor="middle">You agree client will</text>
    <text x="120" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#5C6570" text-anchor="middle">create your invoices</text>
    <text x="120" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#5C6570" text-anchor="middle">(usually 12 months)</text>
  </g>
  
  <!-- Arrow 1 -->
  <g transform="translate(330, 310)">
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <polygon points="0 0, 10 3, 0 6" fill="#F05A37" />
      </marker>
    </defs>
    <path d="M 0 0 L 60 0" stroke="#F05A37" stroke-width="3" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Step 2: Customer Issues Invoice -->
  <g transform="translate(410, 160)">
    <rect width="240" height="320" rx="16" fill="white" stroke="#E4DDD2" stroke-width="2"/>
    <rect width="240" height="50" rx="16" fill="#FEFCE8"/>
    <text x="120" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#854D0E" text-anchor="middle">2. Client Issues Invoice</text>
    
    <!-- Invoice document -->
    <g transform="translate(45, 75)">
      <rect width="150" height="160" rx="8" fill="white" stroke="#CA8A04" stroke-width="3"/>
      
      <!-- Header -->
      <rect x="10" y="10" width="130" height="20" rx="4" fill="#FEF3C7"/>
      <text x="75" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#854D0E" text-anchor="middle">SELF-BILLING</text>
      
      <!-- Invoice details -->
      <text x="15" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#5C6570">SB-2026-1042</text>
      <text x="15" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#5C6570">31 Oct 2026</text>
      
      <line x1="10" y1="68" x2="140" y2="68" stroke="#E4DDD2" stroke-width="1"/>
      
      <!-- Supplier info -->
      <text x="15" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#854D0E">To: Your Business</text>
      <text x="15" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#8A929C">VAT: GB 987 6543 21</text>
      
      <line x1="10" y1="98" x2="140" y2="98" stroke="#E4DDD2" stroke-width="1"/>
      
      <!-- Amount details -->
      <g transform="translate(10, 105)">
        <text x="5" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#5C6570">Services</text>
        <text x="115" y="10" font-family="Monaco, monospace" font-size="8" fill="#5C6570" text-anchor="end">£1,500</text>
        
        <text x="5" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#5C6570">VAT @ 20%</text>
        <text x="115" y="22" font-family="Monaco, monospace" font-size="8" fill="#5C6570" text-anchor="end">£300</text>
        
        <line x1="0" y1="28" x2="130" y2="28" stroke="#854D0E" stroke-width="2"/>
        
        <text x="5" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#854D0E">Total</text>
        <text x="115" y="40" font-family="Monaco, monospace" font-size="9" font-weight="700" fill="#854D0E" text-anchor="end">£1,800</text>
      </g>
    </g>
    
    <text x="120" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#5C6570" text-anchor="middle">Client creates invoice</text>
    <text x="120" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#5C6570" text-anchor="middle">with your VAT number</text>
    <text x="120" y="297" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#5C6570" text-anchor="middle">and sends it to you</text>
  </g>
  
  <!-- Arrow 2 -->
  <g transform="translate(670, 310)">
    <path d="M 0 0 L 60 0" stroke="#F05A37" stroke-width="3" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Step 3: You Check and Record -->
  <g transform="translate(750, 160)">
    <rect width="240" height="320" rx="16" fill="white" stroke="#E4DDD2" stroke-width="2"/>
    <rect width="240" height="50" rx="16" fill="#D1FAE5"/>
    <text x="120" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#065F46" text-anchor="middle">3. You Check & Record</text>
    
    <!-- Checklist -->
    <g transform="translate(35, 80)">
      <!-- Check 1: VAT rate -->
      <circle cx="8" cy="8" r="8" fill="#22C55E"/>
      <path d="M 5 8 L 7 10 L 11 6" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="25" y="13" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#3F4751">VAT rate correct (20%)</text>
      
      <!-- Check 2: Amount -->
      <g transform="translate(0, 32)">
        <circle cx="8" cy="8" r="8" fill="#22C55E"/>
        <path d="M 5 8 L 7 10 L 11 6" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="25" y="13" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#3F4751">Amount matches work</text>
      </g>
      
      <!-- Check 3: Details -->
      <g transform="translate(0, 64)">
        <circle cx="8" cy="8" r="8" fill="#22C55E"/>
        <path d="M 5 8 L 7 10 L 11 6" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="25" y="13" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#3F4751">Your details correct</text>
      </g>
      
      <!-- Warning box -->
      <g transform="translate(0, 105)">
        <rect width="170" height="60" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
        <text x="85" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#92400E" text-anchor="middle">  Important</text>
        <text x="85" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#78350F" text-anchor="middle">VAT is YOUR output tax</text>
        <text x="85" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#78350F" text-anchor="middle">(not input tax to reclaim)</text>
      </g>
    </g>
    
    <text x="120" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#5C6570" text-anchor="middle">Record as SALE</text>
    <text x="120" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#5C6570" text-anchor="middle">Match to payment</text>
    <text x="120" y="297" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#5C6570" text-anchor="middle">when it arrives</text>
  </g>
  
  <!-- Bottom note -->
  <g transform="translate(100, 540)">
    <rect width="1000" height="60" rx="8" fill="white" stroke="#E4DDD2" stroke-width="2"/>
    <text x="500" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#141B24" text-anchor="middle">Key point: You do NOT send your own invoice for supplies covered by the agreement</text>
    <text x="500" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#5C6570" text-anchor="middle">The client's self-billed invoice replaces your sales invoice " Both parties must be VAT registered for VAT self-billing rules to apply</text>
  </g>
</svg>
