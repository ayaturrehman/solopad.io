<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="kill-fee-title kill-fee-desc">
  <title id="kill-fee-title">Kill Fee Clause Progression</title>
  <desc id="kill-fee-desc">Diagram showing five stages of kill fee compensation from 0% before project start to 100% after delivery</desc>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="600" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#0f172a" text-anchor="middle">Kill Fee Stages</text>
  <text x="600" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#64748b" text-anchor="middle">Cancellation compensation as project progresses</text>
  
  <!-- Stage containers -->
  <!-- Stage 1: 0% -->
  <g>
    <rect x="60" y="150" width="200" height="360" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="60" y="150" width="200" height="90" rx="12" fill="#ef4444"/>
    <text x="160" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">0%</text>
    
    <text x="160" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">Before</text>
    <text x="160" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">Project</text>
    <text x="160" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">Start</text>
    
    <text x="160" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">No work</text>
    <text x="160" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">started yet</text>
    <text x="160" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">£0</text>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M 270 330 L 310 330" stroke="#cbd5e1" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 2: 25% -->
  <g>
    <rect x="320" y="150" width="200" height="360" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="320" y="150" width="200" height="90" rx="12" fill="#f97316"/>
    <text x="420" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">25%</text>
    
    <text x="420" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">After</text>
    <text x="420" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">Kickoff</text>
    
    <text x="420" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Discovery,</text>
    <text x="420" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">planning,</text>
    <text x="420" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">initial work</text>
    <text x="420" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">£600</text>
    <text x="420" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">(on £2,400 project)</text>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M 530 330 L 570 330" stroke="#cbd5e1" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 3: 50% -->
  <g>
    <rect x="580" y="150" width="200" height="360" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="580" y="150" width="200" height="90" rx="12" fill="#eab308"/>
    <text x="680" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">50%</text>
    
    <text x="680" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">First</text>
    <text x="680" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">Deliverable</text>
    
    <text x="680" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Wireframes,</text>
    <text x="680" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">first design</text>
    <text x="680" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">round</text>
    <text x="680" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">£1,200</text>
    <text x="680" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">(on £2,400 project)</text>
  </g>
  
  <!-- Arrow 3 -->
  <path d="M 790 330 L 830 330" stroke="#cbd5e1" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 4: 75% -->
  <g>
    <rect x="840" y="150" width="140" height="360" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="840" y="150" width="140" height="90" rx="12" fill="#22c55e"/>
    <text x="910" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">75%</text>
    
    <text x="910" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Near</text>
    <text x="910" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Complete</text>
    
    <text x="910" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Revisions,</text>
    <text x="910" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">refinements,</text>
    <text x="910" y="376" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">final QA</text>
    <text x="910" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">£1,800</text>
    <text x="910" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">(on £2,400)</text>
  </g>
  
  <!-- Arrow 4 -->
  <path d="M 990 330 L 1020 330" stroke="#cbd5e1" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 5: 100% -->
  <g>
    <rect x="1030" y="150" width="140" height="360" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="1030" y="150" width="140" height="90" rx="12" fill="#10b981"/>
    <text x="1100" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">100%</text>
    
    <text x="1100" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">After</text>
    <text x="1100" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Delivery</text>
    
    <text x="1100" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Final files</text>
    <text x="1100" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">delivered,</text>
    <text x="1100" y="376" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">project</text>
    <text x="1100" y="394" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">complete</text>
    <text x="1100" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">£2,400</text>
    <text x="1100" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">(full fee)</text>
  </g>
  
  <!-- Bottom note -->
  <text x="600" y="565" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#475569" text-anchor="middle">If client cancels, they pay the percentage due at that stage</text>
  <text x="600" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">minus any deposit or milestone payments already made</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#cbd5e1"/>
    </marker>
  </defs>
</svg>
