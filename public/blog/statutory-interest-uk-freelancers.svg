<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="400" fill="#f8f9fa"/>
  
  <!-- Pattern grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#e9ecef" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="url(#grid)"/>
  
  <!-- Title -->
  <text x="600" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#212529" text-anchor="middle">How to Calculate Statutory Interest on Unpaid Invoices</text>
  
  <!-- Step 1: Bank Rate + 8% -->
  <rect x="60" y="120" width="300" height="200" rx="8" fill="#fff" stroke="#0066cc" stroke-width="3"/>
  <text x="210" y="170" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">Step 1</text>
  <text x="210" y="205" font-family="Arial, sans-serif" font-size="18" fill="#0066cc" font-weight="bold" text-anchor="middle">Bank of England</text>
  <text x="210" y="230" font-family="Arial, sans-serif" font-size="18" fill="#0066cc" font-weight="bold" text-anchor="middle">Base Rate</text>
  <text x="210" y="260" font-family="Arial, sans-serif" font-size="32" fill="#0066cc" font-weight="bold" text-anchor="middle">+ 8%</text>
  <text x="210" y="290" font-family="Arial, sans-serif" font-size="14" fill="#6c757d" text-anchor="middle">Current: 3.75% + 8%</text>
  <text x="210" y="310" font-family="Arial, sans-serif" font-size="14" fill="#6c757d" text-anchor="middle">= 11.75% per year</text>
  
  <!-- Arrow 1 -->
  <path d="M 360 220 L 440 220" stroke="#0066cc" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0066cc"/>
    </marker>
  </defs>
  
  <!-- Step 2: Days Overdue -->
  <rect x="440" y="120" width="300" height="200" rx="8" fill="#fff" stroke="#0066cc" stroke-width="3"/>
  <text x="590" y="170" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">Step 2</text>
  <text x="590" y="205" font-family="Arial, sans-serif" font-size="18" fill="#0066cc" font-weight="bold" text-anchor="middle">Calculate</text>
  <text x="590" y="230" font-family="Arial, sans-serif" font-size="18" fill="#0066cc" font-weight="bold" text-anchor="middle">Days Overdue</text>
  <text x="590" y="265" font-family="Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">Count from day after</text>
  <text x="590" y="285" font-family="Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">invoice due date</text>
  <text x="590" y="305" font-family="Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">to today</text>
  
  <!-- Arrow 2 -->
  <path d="M 740 220 L 820 220" stroke="#0066cc" stroke-width="3" fill="none" marker-end="url(#arrowhead2)"/>
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0066cc"/>
    </marker>
  </defs>
  
  <!-- Step 3: Apply Formula -->
  <rect x="820" y="120" width="320" height="200" rx="8" fill="#fff" stroke="#28a745" stroke-width="3"/>
  <text x="980" y="170" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">Step 3</text>
  <text x="980" y="205" font-family="Arial, sans-serif" font-size="18" fill="#28a745" font-weight="bold" text-anchor="middle">Apply Formula</text>
  <text x="980" y="240" font-family="Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">(Invoice × Rate × Days)</text>
  <text x="980" y="260" font-family="Arial, sans-serif" font-size="14" fill="#495057" text-anchor="middle">÷ 365</text>
  <text x="980" y="290" font-family="Arial, sans-serif" font-size="16" fill="#28a745" font-weight="bold" text-anchor="middle">= Statutory Interest</text>
  <text x="980" y="310" font-family="Arial, sans-serif" font-size="12" fill="#6c757d" text-anchor="middle">Plus £40/£70/£100 recovery cost</text>
  
  <!-- Footer note -->
  <text x="600" y="370" font-family="Arial, sans-serif" font-size="14" fill="#6c757d" text-anchor="middle">UK freelancers can charge this automatically on B2B invoices under the Late Payment Act 1998</text>
</svg>
