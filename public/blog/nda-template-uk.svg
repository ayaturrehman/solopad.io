<svg width="800" height="300" viewBox="0 0 800 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Discovery Call Card -->
  <rect x="40" y="80" width="180" height="140" rx="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="2"/>
  <circle cx="130" cy="120" r="20" fill="#8B5CF6" opacity="0.2"/>
  <path d="M120 120 L125 125 L140 110" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827" text-anchor="middle">Discovery Call</text>
  <text x="130" y="180" font-family="Arial, sans-serif" font-size="13" fill="#6B7280" text-anchor="middle">Initial enquiry</text>
  <text x="130" y="198" font-family="Arial, sans-serif" font-size="13" fill="#6B7280" text-anchor="middle">sensitive brief</text>
  
  <!-- Arrow 1 -->
  <path d="M230 150 L270 150" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- NDA Card -->
  <rect x="280" y="80" width="180" height="140" rx="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="310" y="105" width="120" height="15" rx="2" fill="#8B5CF6" opacity="0.15"/>
  <rect x="310" y="125" width="120" height="15" rx="2" fill="#8B5CF6" opacity="0.15"/>
  <rect x="310" y="145" width="80" height="15" rx="2" fill="#8B5CF6" opacity="0.15"/>
  <circle cx="410" cy="175" r="12" fill="#8B5CF6"/>
  <path d="M405 175 L408 178 L415 171" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="370" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827" text-anchor="middle">NDA Signed</text>
  
  <!-- Arrow 2 -->
  <path d="M470 150 L510 150" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Contract/Brief Card -->
  <rect x="520" y="80" width="180" height="140" rx="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="545" y="105" width="130" height="12" rx="2" fill="#10B981" opacity="0.2"/>
  <rect x="545" y="122" width="130" height="12" rx="2" fill="#10B981" opacity="0.2"/>
  <rect x="545" y="139" width="130" height="12" rx="2" fill="#10B981" opacity="0.2"/>
  <rect x="545" y="156" width="100" height="12" rx="2" fill="#10B981" opacity="0.2"/>
  <circle cx="665" cy="175" r="12" fill="#10B981"/>
  <text x="660" y="177" font-family="Arial, sans-serif" font-size="16" fill="white" font-weight="bold"></text>
  <text x="610" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#111827" text-anchor="middle">Contract + Brief</text>
  
  <!-- Labels -->
  <text x="400" y="45" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">NDA Workflow for UK Freelancers</text>
  
  <!-- Mutual/One-way notation -->
  <rect x="280" y="240" width="180" height="40" rx="4" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
  <text x="370" y="257" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#92400E" text-anchor="middle">Mutual or One-Way</text>
  <text x="370" y="272" font-family="Arial, sans-serif" font-size="11" fill="#92400E" text-anchor="middle">Choose based on project</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#8B5CF6"/>
    </marker>
  </defs>
</svg>
